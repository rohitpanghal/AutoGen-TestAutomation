<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AI Test Recorder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <span id="status-dot" class="dot idle"></span>
        <span id="status-text">Idle</span>
      </header>

      <div id="setup" class="panel">
        <input id="test-name" type="text" placeholder="Test name (e.g. Cancel order)" />
        <button id="start-btn">Start Recording</button>
        <button id="last-run-btn" class="link-btn hidden">View last run →</button>
      </div>

      <div id="recording" class="panel hidden">
        <div id="action-count">0 actions recorded</div>
        <ul id="action-list"></ul>
        <div class="row">
          <button id="mark-step-btn">Mark Step</button>
          <button id="stop-btn">Stop &amp; Review</button>
        </div>
      </div>

      <div id="sent" class="panel hidden">
        <p>Recording stopped. Review &amp; annotate the steps in the new tab, then generate from there.</p>
        <button id="open-run-btn">Open last results tab</button>
        <button id="new-btn" class="link-btn">New recording</button>
      </div>

      <div id="error" class="panel hidden error-panel"></div>
    </div>
    <script src="../dist/popup.js"></script>
  </body>
</html>
